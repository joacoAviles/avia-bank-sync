name: ci
on:
  push: { branches: [main], tags: ['*-avia.*'] }
  pull_request:
  schedule: [{ cron: '0 12 * * 1' }]   # semanal: ¿el parche sigue aplicando?
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: scripts/prepare-source.sh build/actual
      - run: scripts/verify.sh build/actual
  images:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - run: REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,} scripts/build-images.sh --push
